<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ukázkový nástroj</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 48px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #1f2937;
      background: #f8fafc;
    }

    main {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font: inherit;
      box-sizing: border-box;
    }

    button {
      margin-top: 12px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    #output {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      background: #eff6ff;
      min-height: 48px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mini reflektor</h1>
    <p>Napiš jednu větu o tom, co ses dnes naučil/a. Nástroj z ní vytvoří krátkou reflexi.</p>

    <textarea id="input" placeholder="Dnes jsem pochopil/a, že Cursor pracuje s tím, co mu ukážu..."></textarea>
    <button id="button">Vytvořit reflexi</button>

    <div id="output">Tvoje reflexe se zobrazí tady.</div>
  </main>

  <script>
    const input = document.querySelector("#input");
    const button = document.querySelector("#button");
    const output = document.querySelector("#output");

    button.addEventListener("click", () => {
      const text = input.value.trim();

      if (!text) {
        output.textContent = "Nejdřív napiš jednu větu.";
        return;
      }

      output.textContent = `Dnešní posun: ${text} Příště na to navážu jedním konkrétním krokem.`;
    });
  </script>
</body>
</html>
